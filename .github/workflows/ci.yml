name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend build (needed so frontend/dist exists for packaging)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Python packaging build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dev and build tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" build
      - name: Ruff check
        run: ruff check .
      - name: Mypy (Python type check)
        run: python -m mypy . --config-file mypy.ini
      - name: Pytest
        run: pytest
      - name: Build wheel and sdist
        run: python -m build

